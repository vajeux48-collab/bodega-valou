name: Déployer La Pyramide sur Firebase
on:
  push:
    branches: [main]
    paths:
      - 'pyramide/firestore.rules'
      - 'pyramide/firebase.json'
      - 'pyramide/.firebaserc'
      - '.github/workflows/deploy-pyramide-firebase.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: pyramide-valou
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm ci --prefix pyramide/functions || npm install --prefix pyramide/functions
      - name: Installer Firebase CLI
        run: npm install -g firebase-tools
      - uses: google-github-actions/setup-gcloud@v2
      - name: Vérifier l'accès Google Cloud
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud auth print-access-token > /dev/null
      - name: Déployer les règles et fonctions
        working-directory: pyramide
        env:
          GOOGLE_CLOUD_PROJECT: pyramide-valou
        run: |
          export FIREBASE_TOKEN="$(gcloud auth print-access-token)"
          firebase deploy --project pyramide-valou --only firestore:rules --non-interactive
