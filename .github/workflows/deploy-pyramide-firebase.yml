name: Déployer La Pyramide sur Firebase
on:
  push:
    branches: [main]
    paths:
      - 'pyramide/firestore.rules'
      - 'pyramide/functions/**'
      - 'pyramide/firebase.json'
      - 'pyramide/.firebaserc'
      - '.github/workflows/deploy-pyramide-firebase.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: pyramide-valou
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm ci --prefix pyramide/functions || npm install --prefix pyramide/functions
      - name: Installer Firebase CLI
        run: npm install -g firebase-tools
      - name: Déployer les règles et fonctions
        working-directory: pyramide
        run: firebase deploy --project pyramide-valou --only firestore:rules,functions --non-interactive
